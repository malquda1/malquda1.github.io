<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="50%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanIndigo" x1="60" y1="60" x2="196" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="neuralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Modern dark squircle base -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Ambient inner neural glow -->
  <circle cx="128" cy="128" r="80" fill="url(#neuralGlow)"/>

  <!-- Left & Right Brain Outer Lobe Paths (subtle structural arcs) -->
  <path d="M128 62 C100 56 66 74 66 108 C66 122 72 134 64 146 C56 160 68 184 96 188 C112 190 122 182 128 194" 
        stroke="url(#cyanIndigo)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" stroke-opacity="0.4"/>
  <path d="M128 62 C156 56 190 74 190 108 C190 122 184 134 192 146 C200 160 188 184 160 188 C144 190 134 182 128 194" 
        stroke="url(#cyanIndigo)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" stroke-opacity="0.4"/>

  <!-- Synaptic Connections (Edges) -->
  <g stroke="url(#cyanIndigo)" stroke-linecap="round" stroke-linejoin="round">
    <line x1="128" y1="62" x2="84" y2="86" stroke-width="6"/>
    <line x1="128" y1="62" x2="172" y2="86" stroke-width="6"/>
    <line x1="84" y1="86" x2="68" y2="136" stroke-width="6"/>
    <line x1="172" y1="86" x2="188" y2="136" stroke-width="6"/>
    <line x1="84" y1="86" x2="108" y2="118" stroke-width="6"/>
    <line x1="172" y1="86" x2="148" y2="118" stroke-width="6"/>
    
    <!-- Cross-Hemisphere Attention Bridges -->
    <line x1="108" y1="118" x2="148" y2="118" stroke="#38bdf8" stroke-width="7"/>
    <line x1="108" y1="118" x2="128" y2="152" stroke-width="6"/>
    <line x1="148" y1="118" x2="128" y2="152" stroke-width="6"/>
    
    <line x1="68" y1="136" x2="108" y2="118" stroke-width="5"/>
    <line x1="188" y1="136" x2="148" y2="118" stroke-width="5"/>
    <line x1="68" y1="136" x2="88" y2="182" stroke-width="6"/>
    <line x1="188" y1="136" x2="168" y2="182" stroke-width="6"/>
    
    <line x1="128" y1="152" x2="88" y2="182" stroke-width="5"/>
    <line x1="128" y1="152" x2="168" y2="182" stroke-width="5"/>
    <line x1="128" y1="152" x2="128" y2="194" stroke-width="6"/>
    
    <line x1="88" y1="182" x2="128" y2="194" stroke-width="6"/>
    <line x1="168" y1="182" x2="128" y2="194" stroke-width="6"/>
  </g>

  <!-- Highlight overlay strokes for high contrast -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.75">
    <line x1="128" y1="62" x2="84" y2="86" stroke-width="2"/>
    <line x1="128" y1="62" x2="172" y2="86" stroke-width="2"/>
    <line x1="108" y1="118" x2="148" y2="118" stroke-width="2.5"/>
    <line x1="108" y1="118" x2="128" y2="152" stroke-width="2"/>
    <line x1="148" y1="118" x2="128" y2="152" stroke-width="2"/>
    <line x1="128" y1="152" x2="128" y2="194" stroke-width="2"/>
  </g>

  <!-- Neural Nodes -->
  <circle cx="68" cy="136" r="9" fill="#6366f1"/>
  <circle cx="68" cy="136" r="5" fill="#38bdf8"/>
  <circle cx="188" cy="136" r="9" fill="#6366f1"/>
  <circle cx="188" cy="136" r="5" fill="#38bdf8"/>

  <circle cx="88" cy="182" r="9" fill="#6366f1"/>
  <circle cx="88" cy="182" r="5" fill="#38bdf8"/>
  <circle cx="168" cy="182" r="9" fill="#6366f1"/>
  <circle cx="168" cy="182" r="5" fill="#38bdf8"/>

  <circle cx="84" cy="86" r="11" fill="#4f46e5"/>
  <circle cx="84" cy="86" r="6" fill="#38bdf8"/>
  <circle cx="84" cy="86" r="3" fill="#ffffff"/>

  <circle cx="172" cy="86" r="11" fill="#4f46e5"/>
  <circle cx="172" cy="86" r="6" fill="#38bdf8"/>
  <circle cx="172" cy="86" r="3" fill="#ffffff"/>

  <circle cx="108" cy="118" r="13" fill="#38bdf8" fill-opacity="0.3"/>
  <circle cx="108" cy="118" r="9" fill="#38bdf8"/>
  <circle cx="108" cy="118" r="4.5" fill="#ffffff"/>

  <circle cx="148" cy="118" r="13" fill="#38bdf8" fill-opacity="0.3"/>
  <circle cx="148" cy="118" r="9" fill="#38bdf8"/>
  <circle cx="148" cy="118" r="4.5" fill="#ffffff"/>

  <circle cx="128" cy="152" r="14" fill="#38bdf8" fill-opacity="0.35"/>
  <circle cx="128" cy="152" r="10" fill="#38bdf8"/>
  <circle cx="128" cy="152" r="5" fill="#ffffff"/>

  <circle cx="128" cy="62" r="12" fill="#38bdf8" fill-opacity="0.35"/>
  <circle cx="128" cy="62" r="8" fill="#38bdf8"/>
  <circle cx="128" cy="62" r="4" fill="#ffffff"/>

  <circle cx="128" cy="194" r="10" fill="#6366f1"/>
  <circle cx="128" cy="194" r="6" fill="#38bdf8"/>
  <circle cx="128" cy="194" r="3" fill="#ffffff"/>
</svg>