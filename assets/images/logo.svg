<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1626"/>
      <stop offset="50%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanIndigo" x1="50" y1="78" x2="138" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Modern dark squircle base -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Monogram 'M' -->
  <path d="M50 180V78L94 138L138 78V180" 
        stroke="url(#cyanIndigo)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Monogram 'A' -->
  <path d="M156 180L188 78L220 180" 
        stroke="#ffffff" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- 'A' Crossbar -->
